# /etc/falco/config.d/falco.gvisor_plugin.yaml として配置する設定例。
# config.d のリスト (plugins / load_plugins / rules_files) は falco.yaml に追記されるため、
# 既存の container プラグインや標準ルールの設定はそのまま残る。
plugins:
  - name: gvisor
    library_path: /usr/share/falco/plugins/libgvisor.so
    init_config:
      # pod-init.json の sinks[].config.endpoint と一致させる。
      # systemd の PrivateTmp=true 環境では /tmp が runsc から見えないため /run 配下に置く。
      socketPath: /run/gvisor_events.sock
      maxEventSize: 65536
    open_params: ""

load_plugins: [gvisor]

rules_files:
  # Falco 標準ルールを gVisor 用に移植したルール。通常のコンテナと同じ条件で検知する。
  - /etc/falco/gvisor_falco_rules.yaml
  # 以下は Falco 標準ルールにない独自のルールのため、通常のコンテナと検知結果が揃わない。必要な場合だけ有効にする。
  # シェルの起動をすべて検知するサンプルルール (標準ルールは端末付きのシェルだけを検知する)
  # - /etc/falco/gvisor_rules.yaml
  # gVisor の全イベントをログに出す場合 (デバッグ・監査用)
  # - /etc/falco/gvisor_log_all_rules.yaml
